##
## This configuration file is used by PIConGPU's TBG tool to create a
## batch script for PIConGPU runs. For a detailed description of PIConGPU
## configuration files including all available variables, see
##
##                      docs/TBG_macros.cfg
##


#################################
## Section: Required Variables ##
#################################

TBG_wallTime="72:00:00"

TBG_devices_x=1
TBG_devices_y=1
TBG_devices_z=1

TBG_gridSize="256 256 256"
TBG_steps="100"

TBG_periodic="--periodic 1 1 1"


#################################
## Section: Optional Variables ##
#################################
# particles:
# d
# t
# n
# He3

TBG_pngL_YX="--d_png.period 100 --d_png.axis yx --d_png.slicePoint 0.5 --d_png.folder pngdectronsYX"
TBG_pngR_YX="--t_png.period 100 --t_png.axis yx --t_png.slicePoint 0.5 --t_png.folder pngdectronsYX"
TBG_pngP1_YX="--n_png.period 100 --n_png.axis yx --n_png.slicePoint 0.5 --n_png.folder pngdectronsYX"
TBG_pngP2_YX="--He3_png.period 100 --He3_png.axis yx --He3_png.slicePoint 0.5 --He3_png.folder pngdectronsYX"

# [in keV]
TBG_t_Bin="--t_energyHistogram.period 1 --t_energyHistogram.filter all --t_energyHistogram.binCount 4096 --t_energyHistogram.minEnergy 0 --t_energyHistogram.maxEnergy 20000" # up to 20 MeV
TBG_d_Bin="--d_energyHistogram.period 1 --d_energyHistogram.filter all --d_energyHistogram.binCount 4096 --d_energyHistogram.minEnergy 0 --d_energyHistogram.maxEnergy 20000" 
TBG_n_Bin="--n_energyHistogram.period 1 --n_energyHistogram.filter all --n_energyHistogram.binCount 4096 --n_energyHistogram.minEnergy 0 --n_energyHistogram.maxEnergy 20000" 
TBG_He3_Bin="--He3_energyHistogram.period 1 --He3_energyHistogram.filter all --He3_energyHistogram.binCount 4096 --He3_energyHistogram.minEnergy 0 --He3_energyHistogram.maxEnergy 20000" 

TBG_plugins="!TBG_t_Bin                     \
              !TBG_d_Bin                        \
                !TBG_n_Bin                     \
                    !TBG_He3_Bin                     \
                        !TBG_pngL_YX                        \
                        !TBG_pngR_YX                        \
                            !TBG_pngP1_YX                        \
                            !TBG_pngP2_YX                        \
                                --t_macroParticlesCount.period 1 \
                                --d_macroParticlesCount.period 1 \
                                --n_macroParticlesCount.period 1 \
                                --He3_macroParticlesCount.period 1"


#################################
## Section: Program Parameters ##
#################################

TBG_deviceDist="!TBG_devices_x !TBG_devices_y !TBG_devices_z"

TBG_programParams="-d !TBG_deviceDist \
                   -g !TBG_gridSize   \
                   -s !TBG_steps      \
                   !TBG_periodic      \
                   !TBG_plugins       \
                   --versionOnce"

# TOTAL number of devices
TBG_tasks="$(( TBG_devices_x * TBG_devices_y * TBG_devices_z ))"

"$TBG_cfgPath"/submitAction.sh