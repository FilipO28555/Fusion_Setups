##
## This configuration file is used by PIConGPU's TBG tool to create a
## batch script for PIConGPU runs. For a detailed description of PIConGPU
## configuration files including all available variables, see
##
##                      docs/TBG_macros.cfg
##


#################################
## Section: Required Variables ##
#################################

TBG_wallTime="72:00:00"

TBG_devices_x=2
TBG_devices_y=1
TBG_devices_z=2

TBG_gridSize="768 3072 128"
TBG_steps="7500"

TBG_periodic="--periodic 1 0 1"


#################################
## Section: Optional Variables ##
#################################
# change:
# d -> d
# eR -> t
# eP1 -> n
# eP2 -> He4

TBG_pngL_YX="--d_png.period 100 --d_png.axis yx --d_png.slicePoint 0.5 --d_png.folder pngdectronsYX"
TBG_pngR_YX="--t_png.period 100 --t_png.axis yx --t_png.slicePoint 0.5 --t_png.folder pngdectronsYX"
TBG_pngP1_YX="--n_png.period 100 --n_png.axis yx --n_png.slicePoint 0.5 --n_png.folder pngdectronsYX"
TBG_pngP2_YX="--He4_png.period 100 --He4_png.axis yx --He4_png.slicePoint 0.5 --He4_png.folder pngdectronsYX"

# [in keV]
TBG_t_Bin="--t_energyHistogram.period 500 --t_energyHistogram.filter all --t_energyHistogram.binCount 1024 --t_energyHistogram.minEnergy 0 --t_energyHistogram.maxEnergy 500000"
TBG_d_Bin="--d_energyHistogram.period 500 --d_energyHistogram.filter all --d_energyHistogram.binCount 1024 --d_energyHistogram.minEnergy 0 --d_energyHistogram.maxEnergy 500000"
TBG_n_Bin="--n_energyHistogram.period 500 --n_energyHistogram.filter all --n_energyHistogram.binCount 1024 --n_energyHistogram.minEnergy 0 --n_energyHistogram.maxEnergy 500000"
TBG_He4_Bin="--He4_energyHistogram.period 500 --He4_energyHistogram.filter all --He4_energyHistogram.binCount 1024 --He4_energyHistogram.minEnergy 0 --He4_energyHistogram.maxEnergy 500000"

TBG_plugins="!TBG_t_Bin                     \
              !TBG_d_Bin                        \
                !TBG_n_Bin                     \
                    !TBG_He4_Bin                     \
                        !TBG_pngL_YX                        \
                        !TBG_pngR_YX                        \
                            !TBG_pngP1_YX                        \
                            !TBG_pngP2_YX                        \
                                --t_macroParticlesCount.period 100 \
                                --d_macroParticlesCount.period 100 \
                                --n_macroParticlesCount.period 100 \
                                --He4_macroParticlesCount.period 100"


#################################
## Section: Program Parameters ##
#################################

TBG_deviceDist="!TBG_devices_x !TBG_devices_y !TBG_devices_z"

TBG_programParams="-d !TBG_deviceDist \
                   -g !TBG_gridSize   \
                   -s !TBG_steps      \
                   !TBG_periodic      \
                   !TBG_plugins       \
                   --versionOnce"

# TOTAL number of devices
TBG_tasks="$(( TBG_devices_x * TBG_devices_y * TBG_devices_z ))"

"$TBG_cfgPath"/submitAction.sh
